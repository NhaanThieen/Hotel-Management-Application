<head th:remove="all">
    <title>Quản lý loại phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/main.css">
</head>

<div xmlns:th="http://www.thymeleaf.org" th:replace="~{Base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}">

    <div id="custom-menu-items" th:remove="tag">
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1">
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)" class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start">
                <span class="d-flex align-items-center">
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i>
                    <span th:text="${groupDto.name}"></span>
                </span>
                <i class="fa-solid fa-chevron-down small text-white-50"></i>
            </button>
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded">
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}" class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a>
            </div>
        </div>
    </div>

    <div id="custom-page-content" th:remove="tag">
        <div class="container-fluid py-3">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold m-0">
                        <i class="fa-solid fa-box-open me-2 text-primary"></i> Loại phòng
                    </h4>
                    <span class="text-muted small">Danh sách các loại phòng đang có trong hệ thống</span>
                </div>
                <button class="btn btn-primary shadow-sm btn-roomtype-add" type="button">
                    <i class="fa-solid fa-plus me-1"></i> Thêm loại phòng
                </button>
            </div>

            <div class="card shadow-sm border-0 overflow-hidden mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-secondary">
                                <tr>
                                    <th class="ps-4">Mã</th>
                                    <th>Tên loại phòng</th>
                                    <th>Giá/đêm</th>
                                    <th class="text-center pe-4">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="roomType : ${roomTypeResponse.roomTypes}">
                                    <td class="ps-4 fw-semibold" th:text="${roomType.roomTypeId}">1</td>
                                    <td th:text="${roomType.name}">Standard</td>
                                    <td th:text="${#numbers.formatDecimal(roomType.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">500,000 đ</td>
                                    <td class="text-center pe-4">
                                        <button type="button"
                                                class="btn btn-sm btn-outline-primary me-1 btn-roomtype-edit"
                                                th:attr="data-id=${roomType.roomTypeId},data-name=${roomType.name},data-price=${roomType.price}"
                                                title="Chỉnh sửa">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </button>
                                        <button type="button"
                                                class="btn btn-sm btn-outline-danger btn-roomtype-delete"
                                                th:attr="data-id=${roomType.roomTypeId},data-name=${roomType.name}"
                                                title="Xóa">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted small" th:text="|Tổng số ${#lists.size(roomTypeResponse.roomTypes)} loại phòng|">Tổng số 0 loại phòng</span>
            </div>

            <div class="modal fade" id="roomTypeModal" tabindex="-1" aria-labelledby="roomTypeModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-lg">
                    <div class="modal-content border-0 shadow">
                        <form id="roomTypeForm" method="post" action="#">
                            <div class="modal-header bg-light border-bottom-0">
                                <h5 class="modal-title fw-bold text-dark" id="roomTypeModalLabel">Thêm loại phòng</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" id="roomTypeId" name="roomTypeId">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="roomTypeName" class="form-label">Tên loại phòng</label>
                                        <input type="text" class="form-control" id="roomTypeName" name="name" placeholder="Ví dụ: Deluxe">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="roomTypePrice" class="form-label">Giá/đêm</label>
                                        <input type="number" class="form-control" id="roomTypePrice" name="price" min="0" step="1" placeholder="Ví dụ: 500000">
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer border-top-0 bg-light">
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                                <button type="submit" class="btn btn-primary" id="roomTypeSubmitBtn">Lưu thay đổi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="roomTypeDeleteModal" tabindex="-1" aria-labelledby="roomTypeDeleteModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content border-0 shadow">
                        <form id="roomTypeDeleteForm" method="post" action="#">
                            <div class="modal-header bg-light border-bottom-0">
                                <h5 class="modal-title fw-bold text-dark" id="roomTypeDeleteModalLabel">Xóa loại phòng</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" id="roomTypeDeleteId" name="roomTypeId">
                                <p class="mb-0">Bạn có chắc chắn muốn xóa loại phòng <strong id="roomTypeDeleteName">-</strong> không?</p>
                            </div>
                            <div class="modal-footer border-top-0 bg-light">
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                                <button type="submit" class="btn btn-danger">Xóa</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>
