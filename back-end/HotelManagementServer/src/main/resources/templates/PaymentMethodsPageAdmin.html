<head th:remove="all">
    <title>Quản Lý Phương Thức Thanh Toán - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/main.css">
</head>

<div xmlns:th="http://www.thymeleaf.org"
    th:replace="~{Base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}">

    <div id="custom-menu-items" th:remove="tag">
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1">
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)"
                class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start">
                <span class="d-flex align-items-center">
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i>
                    <span th:text="${groupDto.name}"></span>
                </span>
                <i class="fa-solid fa-chevron-down small text-white-50"></i>
            </button>
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded">
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}"
                    class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a>
            </div>
        </div>
    </div>

    <div id="custom-page-content" th:remove="tag">
        <div class="container-fluid py-3">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold m-0 text-dark">
                        <i class="fa-solid fa-credit-card text-primary me-2"></i>Phương Thức Thanh Toán
                    </h4>
                    <span class="text-muted small">Quản lý các cổng thanh toán hỗ trợ trong hệ thống</span>
                </div>
                <button id="btnAddPayment" class="btn btn-primary fw-semibold shadow-sm" data-bs-toggle="modal" data-bs-target="#paymentModal">
                    <i class="fa-solid fa-plus me-1"></i> Thêm phương thức
                </button>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col" class="text-secondary small fw-semibold text-center" style="width: 50px;">STT</th>
                                    <th scope="col" class="text-secondary small fw-semibold">Tên phương thức</th>
                                    <th scope="col" class="text-secondary small fw-semibold">Mã</th>
                                    <th scope="col" class="text-secondary small fw-semibold">Ghi chú</th>
                                    <th scope="col" class="text-secondary small fw-semibold text-center">Trạng thái</th>
                                    <th scope="col" class="text-secondary small fw-semibold text-end pe-4">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="method, stat : ${paymentMethods}">
                                    <td class="text-center text-muted" th:text="${stat.count}">1</td>
                                    <td class="fw-semibold text-dark" th:text="${method.name}">Tiền mặt</td>
                                    <td><span class="badge bg-light text-dark border" th:text="${method.code}">CASH</span></td>
                                    <td class="text-muted small" th:text="${method.description}">Thanh toán tại quầy</td>
                                    <td class="text-center">
                                        <span class="badge" th:classappend="${method.isActive ? 'bg-success' : 'bg-secondary'}" th:text="${method.isActive ? 'Hoạt động' : 'Tạm ẩn'}">Hoạt động</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <button class="btn btn-sm btn-outline-primary me-1 btn-edit-payment" title="Chỉnh sửa"
                                                th:data-id="${method.id}"
                                                th:data-name="${method.name}"
                                                th:data-code="${method.code}"
                                                th:data-desc="${method.description}"
                                                th:data-active="${method.isActive}">
                                            <i class="fa-solid fa-pen"></i>
                                        </button>
                                        
                                        <form th:action="@{/admin/payment-methods/toggle}" method="POST" class="d-inline">
                                            <input type="hidden" name="id" th:value="${method.id}">
                                            <button type="submit" class="btn btn-sm" 
                                                    th:classappend="${method.isActive ? 'btn-outline-danger' : 'btn-outline-success'}" 
                                                    th:title="${method.isActive ? 'Khóa' : 'Mở khóa'}"
                                                    onclick="return confirm('Bạn có chắc chắn thay đổi trạng thái?');">
                                                <i class="fa-solid" th:classappend="${method.isActive ? 'fa-lock' : 'fa-unlock'}"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>

                                <tr th:if="${paymentMethods == null}">
                                    <td class="text-center text-muted">1</td>
                                    <td class="fw-semibold text-dark">Tiền mặt tại quầy</td>
                                    <td><span class="badge bg-light text-dark border">CASH</span></td>
                                    <td class="text-muted small">Thanh toán bằng tiền mặt VNĐ hoặc USD</td>
                                    <td class="text-center"><span class="badge bg-success">Hoạt động</span></td>
                                    <td class="text-end pe-4">
                                        <button class="btn btn-sm btn-outline-primary me-1 btn-edit-payment"
                                                data-id="1" data-name="Tiền mặt tại quầy" data-code="CASH" data-desc="Thanh toán bằng tiền mặt VNĐ hoặc USD" data-active="true">
                                            <i class="fa-solid fa-pen"></i>
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-lock"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div> 
        
        <div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header bg-light border-bottom-0">
                        <h5 class="modal-title fw-bold text-dark" id="paymentModalLabel">Thêm mới Phương thức</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/admin/payment-methods/save}" method="POST" id="paymentForm">
                        <div class="modal-body">
                            <input type="hidden" name="id" id="methodId">
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-muted">Tên phương thức <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="name" id="methodName" placeholder="VD: Ví điện tử Momo" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-muted">Mã Code hệ thống <span class="text-danger">*</span></label>
                                <input type="text" class="form-control text-uppercase" name="code" id="methodCode" placeholder="VD: MOMO" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-muted">Ghi chú / Hướng dẫn</label>
                                <textarea class="form-control" name="description" id="methodDesc" rows="2" placeholder="Ghi chú hiển thị cho lễ tân..."></textarea>
                            </div>

                            <div class="form-check form-switch mt-3">
                                <input class="form-check-input" type="checkbox" role="switch" id="statusSwitch" name="isActive" value="true" checked>
                                <label class="form-check-label fw-semibold text-dark" for="statusSwitch">Kích hoạt phương thức này</label>
                            </div>
                        </div>
                        <div class="modal-footer border-top-0 bg-light">
                            <button type="button" class="btn btn-outline-secondary fw-semibold" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary fw-semibold">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Lưu thay đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../static/js/admin.js" th:src="@{/js/admin.js}"></script>
    </div>
</div>
