<head th:remove="all">
    <title>Live Server - Lễ Tân Quản Lý Phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/main.css">
</head>

<div xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}">
    
    <div id="custom-menu-items" th:remove="tag">
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1">
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)" class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start">
                <span class="d-flex align-items-center">
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i>
                    <span th:text="${groupDto.name}"></span>
                </span>
                <i class="fa-solid fa-chevron-down small text-white-50"></i>
            </button>
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded">
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}" class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a>
            </div>
        </div>
    </div>

    <div id="custom-page-content" th:remove="tag">
        <div class="container-fluid py-2">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0"><i class="fa-solid fa-bell-concierge me-2 text-primary"></i>Quản Lý Trạng Thái Phòng</h4>
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
                <div class="col" th:each="room : ${rooms}">
                    <div class="card h-100 shadow-sm border-0 position-relative">
                        
                        <img th:src="${room.thumbnail != null ? room.thumbnail : 'https://via.placeholder.com/300x150?text=No+Image'}" 
                             class="card-img-top" alt="Ảnh phòng" style="height: 160px; object-fit: cover;">
                        
                        <div class="card-body d-flex flex-column">
                            
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="card-title fw-bold text-primary m-0" th:text="${room.roomName}">Phòng 101</h5>
                                
                                <th:block th:switch="${room.roomStatusId.name}">
                                    <span th:case="'Available'" class="badge bg-success">Trống</span>
                                    <span th:case="'Occupied'" class="badge bg-danger">Đang sử dụng</span>
                                    <span th:case="'Maintenance'" class="badge bg-secondary">Bảo trì</span>
                                    <span th:case="'Booking'" class="badge text-dark" style="background-color: #ffc107;">Đã đặt trước</span>
                                </th:block>
                            </div>

                            <p class="card-text small text-muted mb-3">
                                <i class="fa-solid fa-users me-1"></i> Sức chứa: <span th:text="${room.capacity}">2</span> người <br>
                                <i class="fa-solid fa-money-bill-wave me-1"></i> Giá: <strong class="text-dark" th:text="|${#numbers.formatDecimal(room.price, 0, 'POINT', 0, 'COMMA')} đ|"></strong>
                            </p>

                            <div class="mt-auto d-grid gap-2">
                                
                                <a th:if="${room.roomStatusId.name == 'Available'}" 
                                   th:href="@{/receptionist/booking/create(roomId=${room.roomId})}" 
                                   class="btn btn-outline-success btn-sm">
                                    <i class="fa-solid fa-key me-1"></i> Tạo Đặt Phòng / Check-in
                                </a>

                                <th:block th:if="${room.roomStatusId.name == 'Occupied'}">
                                    <a th:href="@{/receptionist/booking/checkout(roomId=${room.roomId})}" 
                                       class="btn btn-outline-danger btn-sm">
                                        <i class="fa-solid fa-sign-out-alt me-1"></i> Trả Phòng (Check-out)
                                    </a>
                                    <a th:href="@{/receptionist/services/manage(roomId=${room.roomId})}" 
                                       class="btn btn-outline-info btn-sm">
                                        <i class="fa-solid fa-bell-concierge me-1"></i> Thêm Dịch Vụ
                                    </a>
                                </th:block>

                                <a th:if="${room.roomStatusId.name == 'Booking'}" 
                                   th:href="@{/receptionist/booking/checkin(roomId=${room.roomId})}" 
                                   class="btn btn-warning btn-sm text-dark">
                                    <i class="fa-solid fa-calendar-check me-1"></i> Nhận Phòng (Check-in)
                                </a>

                                <button th:if="${room.roomStatusId.name == 'Maintenance'}" 
                                        class="btn btn-secondary btn-sm" disabled>
                                    <i class="fa-solid fa-tools me-1"></i> Đang sửa chữa
                                </button>
                                
                            </div>
                            
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${rooms.isEmpty()}" class="alert alert-info text-center mt-3">
                Không tìm thấy dữ liệu phòng nào trong hệ thống!
            </div>
            
        </div>
    </div>
</div>
