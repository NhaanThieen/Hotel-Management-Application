<div xmlns:th="http://www.thymeleaf.org" th:replace="~{Base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}"> 

    <div id="custom-menu-items" th:remove="tag"> 
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1"> 
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)" class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start"> 
                <span class="d-flex align-items-center"> 
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i> 
                    <span th:text="${groupDto.name}"></span> 
                </span> 
                <i class="fa-solid fa-chevron-down small text-white-50"></i> 
            </button> 
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded"> 
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}" class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a> 
            </div> 
        </div> 
    </div> 

    <div id="custom-page-content" th:remove="tag"> 
        <div class="container-fluid py-4" style="max-width: 900px;">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0 text-primary">
                    <i class="fa-solid fa-user-plus me-2"></i>Thêm Thành Viên Hệ Thống
                </h4>
                <a th:href="@{/admin/user/}" class="btn btn-outline-secondary btn-sm">
                    <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <!-- Hiển thị lỗi exception -->
                    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2"></i>
                        <span th:text="${errorMsg}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/admin/user/addOrUpdateUser/process}" method="POST" th:object="${userForm}" enctype="multipart/form-data">

                        <div class="row g-4">

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                                <input th:field="*{name}" type="text" class="form-control" placeholder="VD: Nguyễn Văn A" required>
                                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-1"></div>
                            </div>


                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Tên đăng nhập <span class="text-danger">*</span></label>
                                <input th:field="*{userName}" type="text" class="form-control" placeholder="VD: admin_nhan" required>
                                <div th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}" class="text-danger small mt-1"></div>
                            </div>


                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                                <input th:field="*{password}" type="password" class="form-control" placeholder="Nhập mật khẩu tài khoản" required>
                                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger small mt-1"></div>
                            </div>


                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Số điện thoại</label>
                                <input th:field="*{phone}" type="text" class="form-control" placeholder="VD: 0912345678">
                                <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger small mt-1"></div>
                            </div>


                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Địa chỉ Email</label>
                                <input th:field="*{email}" type="email" class="form-control" placeholder="VD: nguyenvana@gmail.com">
                                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small mt-1"></div>
                            </div>


                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Chức vụ / Vai trò <span class="text-danger">*</span></label>
                                <select th:field="*{roleId}" class="form-select" required>
                                    <option value="" selected>-- Chọn chức vụ --</option>
                                    <option th:each="userRolesItem : ${userRoles}" 
                                            th:value="${userRolesItem.roleId}"
                                            th:text="${userRolesItem.name}">
                                    </option>
                                </select>
                                <div th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}" class="text-danger small mt-1"></div>
                            </div>


                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Ảnh đại diện (Avatar)</label>
                                <input th:field="*{avatarFile}" type="file" class="form-control" accept="image/png, image/jpeg">
                                <div class="form-text mt-1">Hỗ trợ định dạng ảnh PNG, JPEG.</div>
                                <div th:if="${#fields.hasErrors('avatarFile')}" th:errors="*{avatarFile}" class="text-danger small mt-1"></div>

                            </div>


                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end gap-2">
                            <button type="reset" class="btn btn-light border">Nhập lại</button>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Lưu thông tin
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div> 
    </div>
</div>
