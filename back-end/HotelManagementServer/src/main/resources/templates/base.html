<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(sidebarMenuContent, pageContent)">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Giao Diện Quản Trị</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/main.css}">
    </head>
    <body class="bg-light d-flex min-vh-100 overflow-hidden">
        
        <aside class="bg-dark text-white flex-shrink-0 d-flex flex-column vh-100" style="width: 280px;">
            
            <div class="p-3 border-bottom border-secondary bg-black text-center">
                <h5 class="m-0 fw-bold text-success">
                    <i class="fa-solid fa-hotel me-2"></i>SMART HOTEL
                </h5>
            </div>
            
            <nav class="flex-grow-1 p-2 overflow-y-auto">
                <th:block th:replace="${sidebarMenuContent}"></th:block>
            </nav>
            
            <div class="p-3 border-top border-secondary bg-black bg-opacity-25 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center overflow-hidden">
                    <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center flex-shrink-0 text-white" 
                         style="width: 40px; height: 40px;">
                        <i class="fa-solid fa-user-gear fs-5"></i>
                    </div>
                    <div class="ms-3 d-flex flex-column min-w-0">
                        <span class="text-white fw-bold text-truncate small" title="Nguyễn Thành Nhân">Nguyễn Thành Nhân</span>
                        <span class="text-white-50 text-truncate" style="font-size: 11px;">Quản trị viên hệ thống</span>
                    </div>
                </div>
                <button class="btn btn-sm text-danger border-0 rounded p-2 btn-logout d-flex align-items-center justify-content-center transition-all" 
                        style="width: 38px; height: 38px;" 
                        title="Đăng xuất tài khoản">
                    <i class="fa-solid fa-right-from-bracket fs-5"></i>
                </button>
            </div>
            
            <div class="p-2 border-top border-secondary bg-black text-center text-secondary" style="font-size: 10px;">
                Phiên bản 1.0<br>© 2026 Hotel Management System
            </div>
        </aside>
        
        <main class="flex-grow-1 p-4 overflow-y-auto">
            <div class="container-fluid">
                <th:block th:replace="${pageContent}"></th:block>
            </div>
        </main>
        
        <script th:src="@{/js/main.js}"></script>
    </body>
</html>
