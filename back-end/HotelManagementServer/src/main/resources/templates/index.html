<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Giao Diện Quản Trị</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

        <style>
            .hover-bg-effect:hover {
                background-color: #2c3034 !important;
                color: #fff !important;
            }
            .hover-bg-sub:hover {
                background-color: #343a40 !important;
                color: #0dcaf0 !important;
            }
            .nav-link {
                transition: all 0.2s ease;
            }
            
            /* Tùy chỉnh thanh cuộn thu nhỏ cho đẹp mắt */
            nav::-webkit-scrollbar {
                width: 5px;
            }
            nav::-webkit-scrollbar-track {
                background: #212529;
            }
            nav::-webkit-scrollbar-thumb {
                background: #495057;
                border-radius: 4px;
            }
            nav::-webkit-scrollbar-thumb:hover {
                background: #0dcaf0;
            }

            /* Hiệu ứng hover riêng cho nút đăng xuất */
            .btn-logout:hover {
                background-color: #dc3545 !important;
                color: white !important;
            }
        </style>
    </head>
    <body class="bg-light d-flex min-vh-100 overflow-hidden">

        <aside class="bg-dark text-white flex-shrink-0 d-flex flex-column vh-100" style="width: 280px;">

            <div class="p-3 border-bottom border-secondary bg-black text-center">
                <h5 class="m-0 fw-bold text-success">
                    <i class="fa-solid fa-hotel me-2"></i>SMART HOTEL
                </h5>
            </div>

            <nav class="flex-grow-1 p-2 overflow-y-auto">
                <div th:each="groupDto : ${sidebarMenu}" class="mb-1">
                    <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)"
                            class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start">
                        <span class="d-flex align-items-center">
                            <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i>
                            <span th:text="${groupDto.name}"></span>
                        </span>
                        <i class="fa-solid fa-chevron-down small text-white-50"></i>
                    </button>

                    <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded">
                        <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}" class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small"></a>
                    </div>
                </div>
            </nav>

            <div class="p-3 border-top border-secondary bg-black bg-opacity-25 d-flex align-items-center justify-content-between">
                
                <div class="d-flex align-items-center overflow-hidden">
                    <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center flex-shrink-0 text-white" 
                         style="width: 40px; height: 40px;">
                        <i class="fa-solid fa-user-gear fs-5"></i>
                        </div>
                    
                    <div class="ms-3 d-flex flex-column min-w-0">
                        <span class="text-white fw-bold text-truncate small" title="Nguyễn Thành Nhân">Nguyễn Thành Nhân</span>
                        <span class="text-white-50 text-truncate" style="font-size: 11px;">Quản trị viên hệ thống</span>
                    </div>
                </div>

                <button class="btn btn-sm text-danger border-0 rounded p-2 btn-logout d-flex align-items-center justify-content-center transition-all" 
                        style="width: 38px; height: 38px;" 
                        title="Đăng xuất tài khoản">
                    <i class="fa-solid fa-right-from-bracket fs-5"></i>
                </button>
                
            </div>
            <div class="p-2 border-top border-secondary bg-black text-center text-secondary" style="font-size: 10px;">
                Phiên bản 1.0<br>© 2026 Hotel Management System
            </div>
        </aside>

        <main class="flex-grow-1 p-4 overflow-y-auto">
            <div class="container-fluid">
                <div class="alert alert-info py-3" role="alert">
                    <h5 class="alert-heading fw-bold"><i class="fa-solid fa-circle-info me-2"></i>Xin chào quản trị viên</h5>
                    <p class="m-0 small text-secondary">Vui lòng vào các mục để xem thông tin cụ thể.</p>
                </div>
            </div>
        </main>

        <script>
            function toggleSubmenu(submenuId) {
                var submenu = document.getElementById(submenuId);
                if (submenu) {
                    submenu.classList.toggle('d-none');
                }
            }
        </script>
    </body>
</html>
