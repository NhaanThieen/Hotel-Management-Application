<div xmlns:th="http://www.thymeleaf.org" th:replace="~{Base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}">
    <div id="custom-menu-items" th:remove="tag">
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1">
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)" class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start">
                <span class="d-flex align-items-center">
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i>
                    <span th:text="${groupDto.name}"></span>
                </span>
                <i class="fa-solid fa-chevron-down small text-white-50"></i>
            </button>
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded">
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}" class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a>
            </div>
        </div>
    </div>

    <div id="custom-page-content" th:remove="tag">
        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div class="container-fluid py-2">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0"><i class="fa-solid fa-bed me-2 text-primary"></i>Danh Sách Phòng</h4>
                <a th:href="@{/admin/addOrUpdateRoom}" class="btn btn-primary shadow-sm">
                    <i class="fa-solid fa-plus me-1"></i> Thêm Phòng Mới
                </a>
            </div>

            <div class="card shadow-sm border-0 mb-4 overflow-hidden">
                <div class="card-body bg-light rounded">
                    <form th:action="@{/admin/rooms}" method="GET" class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold text-secondary">Tìm kiếm</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                                <input name="name" th:value="${searchCriteria.name}" type="text" class="form-control" placeholder="Nhập tên phòng...">
                            </div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small fw-semibold text-secondary">Loại phòng</label>
                            <select name="typeId" class="form-select">
                                <option value="" selected>Tất cả</option>
                                <option th:each="roomItem : ${roomTypeResponse.roomTypes}" 
                                        th:value="${roomItem.roomTypeId}" 
                                        th:text="${roomItem.name}"
                                        th:selected="${roomItem.roomTypeId == searchCriteria.typeId}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold text-secondary">Trạng thái</label>
                            <select name="statusId" class="form-select">
                                <option value="" selected>Tất cả</option>
                                <option th:each="roomItem : ${roomStatusResponse.roomStatus}" 
                                        th:value="${roomItem.roomStatusId}" 
                                        th:text="${roomItem.name}"
                                        th:selected="${roomItem.roomStatusId == searchCriteria.statusId}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-secondary w-100">Lọc dữ liệu</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0 overflow-hidden mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">

                            <thead class="table-light text-secondary">
                                <tr>
                                    <th class="ps-4">Số Phòng</th>
                                    <th>Hình Ảnh</th>
                                    <th>Loại Phòng</th>
                                    <th>Sức Chứa</th> 
                                    <th>Giường</th> 
                                    <th>Giá/Đêm</th>
                                    <th>Trạng Thái</th>
                                    <th class="text-center pe-4">Thao Tác</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="roomItem : ${roomSearchResponse.rooms}">

                                    <td class="ps-4 fw-bold" th:text="${roomItem.name}"></td>

                                    <td>
                                        <img th:src="${roomItem.imgURL}" alt="Ảnh phòng" class="rounded border shadow-sm" style="width: 80px; height: 50px; object-fit: cover;">
                                    </td>

                                    <td th:switch="${roomItem.roomTypeId}">
                                        <span th:case="1"
                                              class="px-2 py-1 rounded small fw-semibold"
                                              style="background-color: #e9ecef; color: #495057;"
                                              th:text="${roomItem.roomTypeName}">
                                        </span>
                                        <span th:case="2"
                                              class="px-2 py-1 rounded small fw-semibold"
                                              style="background-color: #fff3cd; color: #664d03;"
                                              th:text="${roomItem.roomTypeName}">
                                        </span>
                                        <span th:case="*"
                                              class="px-2 py-1 rounded small fw-semibold bg-light text-secondary border"
                                              th:text="${roomItem.roomTypeName}">
                                        </span>

                                    </td> 

                                    <td>
                                        <i class="fa-solid fa-users text-secondary me-1"></i>
                                        <span th:text="${roomItem.capacity} + ' người'"></span>
                                    </td>

                                    <td>
                                        <ul class="list-unstyled m-0 small">
                                            <li th:each="bed : ${roomItem.beds}" class="text-muted">
                                                <i class="fa-solid fa-bed me-1"></i>
                                                <span th:text="|${bed.quantity} x ${bed.name}|"></span>
                                            </li>
                                        </ul>
                                    </td>

                                    <td th:text="|${#numbers.formatDecimal(roomItem.price, 0, 'POINT', 0, 'COMMA')} đ|"></td>

                                    <td th:switch="${roomItem.roomStatusId}">

                                        <span th:case="1" 
                                              class="px-2 py-1 rounded small fw-semibold text-white" 
                                              style="background-color: #198754;" 
                                              th:text="${roomItem.roomStatusName}">
                                        </span>

                                        <span th:case="2" 
                                              class="px-2 py-1 rounded small fw-semibold text-white" 
                                              style="background-color: #dc3545;" 
                                              th:text="${roomItem.roomStatusName}">
                                        </span>

                                        <span th:case="3" 
                                              class="px-2 py-1 rounded small fw-semibold text-white" 
                                              style="background-color: #fd7e14;" 
                                              th:text="${roomItem.roomStatusName}">
                                        </span>

                                        <span th:case="*" 
                                              class="px-2 py-1 rounded small fw-semibold text-white" 
                                              style="background-color: #6c757d;" 
                                              th:text="${roomItem.roomStatusName}">
                                        </span>

                                    </td>

                                    <td class="text-center pe-4">
                                        <a th:href="@{/admin/addOrUpdateRoom}" class="btn btn-sm btn-outline-primary me-1" title="Chỉnh sửa">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </a>
                                        <button class="btn btn-sm btn-outline-danger" title="Xóa">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </td>

                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm m-0 align-items-center gap-2">

                        <li th:class="|page-item ${roomSearchResponse.currentPage <= 1 ? 'disabled' : ''}|">
                            <a class="page-link rounded-circle d-flex align-items-center justify-content-center" 
                               style="width: 32px; height: 32px;"
                               th:href="@{/admin/rooms(name=${searchCriteria.name}, typeId=${searchCriteria.typeId}, statusId=${searchCriteria.statusId}, page=${roomSearchResponse.currentPage - 1})}" 
                               aria-label="Trước">
                                <i class="fa-solid fa-chevron-left small"></i>
                            </a>
                        </li>

                        <li class="page-item disabled">
                            <span class="page-link border-0 fw-bold text-dark px-3" 
                                  th:text="${roomSearchResponse.currentPage}"></span>
                        </li>

                        <li th:class="|page-item ${roomSearchResponse.rooms.isEmpty() ? 'disabled' : ''}|">
                            <a class="page-link rounded-circle d-flex align-items-center justify-content-center" 
                               style="width: 32px; height: 32px;"
                               th:href="@{/admin/rooms(name=${searchCriteria.name}, typeId=${searchCriteria.typeId}, statusId=${searchCriteria.statusId}, page=${roomSearchResponse.currentPage + 1})}" 
                               aria-label="Sau">
                                <i class="fa-solid fa-chevron-right small"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
