<head th:remove="all">
    <title>Live Server - Rooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/main.css">
</head>
<div xmlns:th="http://www.thymeleaf.org" th:replace="~{Base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}">
    <div id="custom-menu-items" th:remove="tag">
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1">
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)" class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start">
                <span class="d-flex align-items-center">
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i>
                    <span th:text="${groupDto.name}"></span>
                </span>
                <i class="fa-solid fa-chevron-down small text-white-50"></i>
            </button>
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded">
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}" class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a>
            </div>
        </div>
    </div>

    <div id="custom-page-content" th:remove="tag">
        <div class="container-fluid py-2">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0"><i class="fa-solid fa-bed me-2 text-primary"></i>Danh Sách Phòng</h4>
                <button class="btn btn-primary shadow-sm">
                    <i class="fa-solid fa-plus me-1"></i> Thêm Phòng Mới
                </button>
            </div>

            <div class="card shadow-sm border-0 mb-4 overflow-hidden">
                <div class="card-body bg-light rounded">
                    <form th:action="@{/admin/rooms}" method="GET" class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold text-secondary">Tìm kiếm</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                                <input name="name" th:value="${searchCriteria?.name}" type="text" class="form-control" placeholder="Nhập tên phòng...">
                            </div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small fw-semibold text-secondary">Loại phòng</label>
                            <select name="typeId" class="form-select">
                                <option value="" selected>Tất cả</option>
                                <option th:each="roomItem : ${roomTypeResponse.roomTypes}" 
                                        th:value="${roomItem.roomTypeId}" 
                                        th:text="${roomItem.name}"
                                        th:selected="${roomItem.roomTypeId == searchCriteria?.typeId}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold text-secondary">Trạng thái</label>
                            <select name="statusId" class="form-select">
                                <option value="" selected>Tất cả</option>
                                <option th:each="roomItem : ${roomStatusResponse.roomStatus}" 
                                        th:value="${roomItem.roomStatusId}" 
                                        th:text="${roomItem.name}"
                                        th:selected="${roomItem.roomStatusId == searchCriteria?.statusId}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-secondary w-100">Lọc dữ liệu</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0 overflow-hidden mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-secondary">
                                <tr>
                                    <th class="ps-4">Số Phòng</th>
                                    <th>Hình Ảnh</th>
                                    <th>Loại Phòng</th>
                                    <th>Giá/Đêm</th>
                                    <th>Trạng Thái</th>
                                    <th class="text-center pe-4">Thao Tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="roomItem : ${roomSearchResponse.rooms}">
                                    <td class="ps-4 fw-bold" th:text="${roomItem.roomName}"></td>
                                    <td>
                                        <img th:src="${roomItem.avatar}" alt="Ảnh phòng" class="rounded border shadow-sm" style="width: 80px; height: 50px; object-fit: cover;">
                                    </td>
                                    <td th:switch="${roomItem.roomTypeId.roomTypeId}">
                                        <span th:case="1" th:text="${roomItem.roomTypeId.name}" class="badge bg-primary bg-opacity-10 text-primary border border-primary-subtle"></span>
                                        <span th:case="2" th:text="${roomItem.roomTypeId.name}" class="badge bg-warning bg-opacity-10 text-warning border border-warning-subtle"></span>
                                        <span th:case="*" th:text="${roomItem.roomTypeId.name}" class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary-subtle"></span>
                                    </td> <td th:text="|${#numbers.formatDecimal(roomItem.roomTypeId.price, 0, 'POINT', 0, 'COMMA')} đ|"></td>

                                    <td th:switch="${roomItem.roomStatusId.roomStatusId}">
                                        <span th:case="1" th:text="${roomItem.roomStatusId.name}" class="badge bg-success"></span>
                                        <span th:case="2" th:text="${roomItem.roomStatusId.name}" class="badge bg-danger"></span>
                                        <span th:case="3" th:text="${roomItem.roomStatusId.name}" class="badge bg-warning text-dark"></span>
                                        <span th:case="*" th:text="${roomItem.roomStatusId.name}" class="badge bg-secondary"></span>
                                    </td>
                                    <td class="text-center pe-4">
                                        <button class="btn btn-sm btn-outline-primary me-1" title="Chỉnh sửa"><i class="fa-solid fa-pen-to-square"></i></button>
                                        <button class="btn btn-sm btn-outline-danger" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted small">Hiển thị 1 - 3 của 24 phòng</span>
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm m-0">
                        <li class="page-item disabled">
                            <a class="page-link" href="#" tabindex="-1" aria-disabled="true">Trước</a>
                        </li>
                        <li class="page-item active" aria-current="page"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item">
                            <a class="page-link" href="#">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
