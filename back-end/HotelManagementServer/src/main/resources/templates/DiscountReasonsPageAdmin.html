<head th:remove="all">
    <title>Lý do giảm giá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/main.css">
</head>

<div xmlns:th="http://www.thymeleaf.org"
    th:replace="~{Base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}">
    <div id="custom-menu-items" th:remove="tag">
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1">
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)"
                class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start">
                <span class="d-flex align-items-center">
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i>
                    <span th:text="${groupDto.name}"></span>
                </span>
                <i class="fa-solid fa-chevron-down small text-white-50"></i>
            </button>
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded">
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}"
                    class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a>
            </div>
        </div>
    </div>

    <div id="custom-page-content" th:remove="tag">
        <div class="container-fluid py-2">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0">
                    <i class="fa-solid fa-hand-holding-dollar me-2 text-primary"></i>Quản lý Giảm Giá Thủ Công
                </h4>
                <button class="btn btn-primary shadow-sm">
                    <i class="fa-solid fa-plus me-1"></i> Thêm Lý Do Mới
                </button>
            </div>

            <div class="card shadow-sm border-0 mb-4 overflow-hidden">
                <div class="card-body bg-light rounded">
                    <form method="GET" class="row g-3 align-items-end justify-content-between">
                        <div class="col-md-8">
                            <label class="form-label small fw-semibold text-secondary">Tìm kiếm</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                                <input name="name" type="text" class="form-control" placeholder="Nhập tên lý do giảm giá...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-secondary w-100">Lọc dữ liệu</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0 overflow-hidden mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-secondary">
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>Tên Lý Do Giảm Giá</th>
                                    <th class="text-center pe-4">Thao Tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="reason : ${manualDiscountReasons}">
                                    <td class="ps-4  text-secondary" th:text="${reason.manualDiscountReasonId}">1</td>
                                    <td class=" text-dark" th:text="${reason.name}">Sự cố thiết bị phòng</td>
                                    <td class="text-center pe-4">
                                        <button class="btn btn-sm btn-outline-primary me-2" title="Chỉnh sửa"><i class="fa-solid fa-pen-to-square"></i></button>
                                        <button class="btn btn-sm btn-outline-danger" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-center align-items-center mt-4" th:if="${totalPages > 1}">
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm m-0 shadow-sm">
                        
                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-link text-secondary" 
                               th:href="@{/reception/dashboard(page=${currentPage - 1})}" 
                               tabindex="-1">
                                <i class="fa-solid fa-chevron-left me-1"></i>Trước
                            </a>
                        </li>
                        
                        <li class="page-item" 
                            th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                            th:classappend="${currentPage == i ? 'active' : ''}">
                            <a class="page-link" 
                               th:classappend="${currentPage != i ? 'text-secondary' : ''}" 
                               th:href="@{/reception/dashboard(page=${i})}" 
                               th:text="${i + 1}">1</a>
                        </li>
                        
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-link text-secondary" 
                               th:href="@{/reception/dashboard(page=${currentPage + 1})}">
                                Sau<i class="fa-solid fa-chevron-right ms-1"></i>
                            </a>
                        </li>
                        
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
