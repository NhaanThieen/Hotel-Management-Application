<head th:remove="all">
    <title>Live Server - Rooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/main.css">
</head>
<div xmlns:th="http://www.thymeleaf.org" th:replace="~{Base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}">
    <div id="custom-menu-items" th:remove="tag">
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1">
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)" class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start">
                <span class="d-flex align-items-center">
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i>
                    <span th:text="${groupDto.name}"></span>
                </span>
                <i class="fa-solid fa-chevron-down small text-white-50"></i>
            </button>
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded">
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}" class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a>
            </div>
        </div>
    </div>

    <div id="custom-page-content" th:remove="tag">

        <!-- Hiển thị redirect data -->
        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="container-fluid py-2">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0"><i class="fa-solid fa-bed me-2 text-primary"></i>Danh Sách User</h4>
                <a th:href="@{/admin/user/addOrUpdateUser}" class="btn btn-primary shadow-sm">
                    <i class="fa-solid fa-plus me-1"></i> Thêm User Mới
                </a>
            </div>

            <div class="card shadow-sm border-0 mb-4 overflow-hidden">
                <div class="card-body bg-light rounded">
                    <form th:action="@{/admin/user/}" method="GET" class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold text-secondary">Tìm kiếm</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                                <input th:value="${searchCriteria.username}" name="username" type="text" class="form-control" placeholder="Nhập username...">
                            </div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small fw-semibold text-secondary">Chức vụ</label>
                            <select name="roleId" class="form-select">
                                <option value="" selected>Tất cả</option>
                                <option th:each="userRoleItem : ${userRoles}" 
                                        th:value="${userRoleItem.roleId}" 
                                        th:selected="${userRoleItem.roleId == searchCriteria.roleId}"
                                        th:text="${userRoleItem.name}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-3"> 
                            <label class="form-label small fw-semibold text-secondary">Trạng thái</label> 
                            <select name="isDeleted" class="form-select"> 
                                <option value="" th:selected="${searchCriteria.isDeleted == null}">Tất cả</option> 
                                <option value="0" th:selected="${searchCriteria.isDeleted == 0}">Bình thường</option> 
                                <option value="1" th:selected="${searchCriteria.isDeleted == 1}">Đã xóa</option> 
                            </select> 
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-secondary w-100">Lọc dữ liệu</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0 overflow-hidden mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">

                            <thead class="table-light text-secondary">
                                <tr>
                                    <th class="ps-4">Name</th>
                                    <th>Username</th>
                                    <th>Role</th> 
                                    <th>Phone</th>
                                    <th>Trạng thái</th>
                                    <th class="text-center pe-4">Thao Tác</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="user : ${userResponse.users}">

                                    <td class="ps-4 fw-bold" th:text="${user.name}"></td>

                                    <td class="fw-bold" th:text="${user.username}"></td>

                                    <td th:switch="${user.roleId}">
                                        <span th:case="1" class="px-2 py-1 rounded small fw-semibold" 
                                              style="background-color: #ffe2e5; color: #f64e60;" 
                                              th:text="${user.roleName}"></span> 
                                        <span th:case="2" class="px-2 py-1 rounded small fw-semibold" 
                                              style="background-color: #e1f0ff; color: #3699ff;" 
                                              th:text="${user.roleName}"></span> 
                                        <span th:case="3" class="px-2 py-1 rounded small fw-semibold" 
                                              style="background-color: #f3f6f9; color: #7e8299;" 
                                              th:text="${user.roleName}"></span>
                                    </td> 

                                    <td class="fw-bold" th:text="${user.phone}"></td>

                                    <td th:switch="${user.isDeleted}">
                                        <span th:case="0" 
                                              class="px-2 py-1 rounded small fw-semibold text-white" 
                                              style="background-color: #198754;" 
                                              >Bình thường</span>
                                        <span th:case="1" 
                                              class="px-2 py-1 rounded small fw-semibold text-white" 
                                              style="background-color: #FF0000;" 
                                              >Đã xóa</span>
                                    </td>

                                    <td class="text-center pe-4">
                                        <a th:href="@{/admin/user/addOrUpdateUser}" class="btn btn-sm btn-outline-primary me-1" title="Chỉnh sửa">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </a>
                                        <button class="btn btn-sm btn-outline-danger" title="Xóa">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm m-0 align-items-center gap-2">

                        <li th:class="|page-item ${userResponse.currentPage <= 1 ? 'disabled' : ''}|">
                            <a class="page-link rounded-circle d-flex align-items-center justify-content-center" 
                               style="width: 32px; height: 32px;"
                               th:href="@{/admin/user/(username=${searchCriteria.username}, roleId=${searchCriteria.roleId}, isDeleted=${searchCriteria.isDeleted}, page=${userResponse.currentPage - 1})}"
                               aria-label="Trước">
                                <i class="fa-solid fa-chevron-left small"></i>
                            </a>
                        </li>

                        <li class="page-item disabled">
                            <span class="page-link border-0 fw-bold text-dark px-3" 
                                  th:text="${userResponse.currentPage}"></span>
                        </li>

                        <li th:class="|page-item ${userResponse.users.isEmpty() ? 'disabled' : ''}|">
                            <a class="page-link rounded-circle d-flex align-items-center justify-content-center" 
                               style="width: 32px; height: 32px;"
                               th:href="@{/admin/user/(username=${searchCriteria.username}, roleId=${searchCriteria.roleId}, isDeleted=${searchCriteria.isDeleted}, page=${userResponse.currentPage + 1})}"
                               aria-label="Sau">
                                <i class="fa-solid fa-chevron-right small"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
