<head th:remove="all">
    <title>Quản lý dịch vụ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/main.css">
</head>

<div xmlns:th="http://www.thymeleaf.org" th:replace="~{Base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}">

    <div id="custom-menu-items" th:remove="tag">
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1">
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)" class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start">
                <span class="d-flex align-items-center">
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i>
                    <span th:text="${groupDto.name}"></span>
                </span>
                <i class="fa-solid fa-chevron-down small text-white-50"></i>
            </button>
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded">
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}" class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a>
            </div>
        </div>
    </div>

    <div id="custom-page-content" th:remove="tag">
        <div class="container-fluid py-3">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold m-0">
                        <i class="fa-solid fa-bell-concierge me-2 text-primary"></i> Dịch vụ
                    </h4>
                    <span class="text-muted small">Quản lý các dịch vụ đang cung cấp trong khách sạn</span>
                </div>
                <button class="btn btn-primary shadow-sm btn-service-add" type="button">
                    <i class="fa-solid fa-plus me-1"></i> Thêm dịch vụ
                </button>
            </div>

            <div class="card shadow-sm border-0 overflow-hidden mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-secondary">
                                <tr>
                                    <th class="ps-4">Mã</th>
                                    <th>Tên dịch vụ</th>
                                    <th>Loại</th>
                                    <th>Giá</th>
                                    <th>Tồn kho</th>
                                    <th>Trạng thái</th>
                                    <th class="text-center pe-4">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${serviceList == null or #lists.isEmpty(serviceList)}">
                                    <td colspan="7" class="text-center py-5 text-muted">
                                        Chưa có dịch vụ nào.
                                    </td>
                                </tr>
                                <tr th:each="service : ${serviceList}">
                                    <td class="ps-4 fw-semibold" th:text="${service.serviceId}">1</td>
                                    <td th:text="${service.name}">Nước suối</td>
                                    <td th:text="${service.serviceTypeId != null ? service.serviceTypeId.name : '-'}">Đồ uống</td>
                                    <td th:text="${#numbers.formatDecimal(service.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">20,000 đ</td>
                                    <td th:text="${service.stock}">100</td>
                                    <td>
                                        <span class="badge" th:classappend="${service.isDeleted} ? 'bg-secondary' : ${service.stock > 0} ? 'bg-success' : 'bg-warning text-dark'"
                                              th:text="${service.isDeleted ? 'Đã ẩn' : (service.stock > 0 ? 'Đang bán' : 'Hết hàng')}">Đang bán</span>
                                    </td>
                                    <td class="text-center pe-4">
                                        <button type="button"
                                                class="btn btn-sm btn-outline-primary me-1 btn-service-edit"
                                                th:attr="data-id=${service.serviceId},data-name=${service.name},data-price=${service.price},data-stock=${service.stock},data-type-id=${service.serviceTypeId != null ? service.serviceTypeId.serviceTypeId : ''}"
                                                title="Chỉnh sửa">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </button>
                                        <button type="button"
                                                class="btn btn-sm btn-outline-danger btn-service-delete"
                                                th:attr="data-id=${service.serviceId},data-name=${service.name}"
                                                title="Xóa">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted small" th:text="|Tổng số ${(serviceList != null ? #lists.size(serviceList) : 0)} dịch vụ|">Tổng số 0 dịch vụ</span>
            </div>

            <div class="modal fade" id="serviceModal" tabindex="-1" aria-labelledby="serviceModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-lg">
                    <div class="modal-content border-0 shadow">
                        <form id="serviceForm" method="post" action="#">
                            <div class="modal-header bg-light border-bottom-0">
                                <h5 class="modal-title fw-bold text-dark" id="serviceModalLabel">Thêm dịch vụ</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" id="serviceId" name="serviceId">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="serviceName" class="form-label">Tên dịch vụ</label>
                                        <input type="text" class="form-control" id="serviceName" name="name" placeholder="Ví dụ: Nước suối">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="serviceTypeId" class="form-label">Loại dịch vụ</label>
                                        <select class="form-select" id="serviceTypeId" name="serviceTypeId">
                                            <option value="">Chọn loại dịch vụ</option>
                                            <option th:each="serviceType : ${serviceTypeList}" th:value="${serviceType.serviceTypeId}" th:text="${serviceType.name}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="servicePrice" class="form-label">Giá</label>
                                        <input type="number" class="form-control" id="servicePrice" name="price" min="0" step="1" placeholder="Ví dụ: 20000">
                                    </div>
                                    <div class="col-md-4">
                                        <label for="serviceStock" class="form-label">Tồn kho</label>
                                        <input type="number" class="form-control" id="serviceStock" name="stock" min="0" step="1" placeholder="Ví dụ: 100">
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer border-top-0 bg-light">
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                                <button type="submit" class="btn btn-primary" id="serviceSubmitBtn">Lưu thay đổi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="serviceDeleteModal" tabindex="-1" aria-labelledby="serviceDeleteModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content border-0 shadow">
                        <form id="serviceDeleteForm" method="post" action="#">
                            <div class="modal-header bg-light border-bottom-0">
                                <h5 class="modal-title fw-bold text-dark" id="serviceDeleteModalLabel">Xóa dịch vụ</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" id="serviceDeleteId" name="serviceId">
                                <p class="mb-0">Bạn có chắc chắn muốn xóa dịch vụ <strong id="serviceDeleteName">-</strong> không?</p>
                            </div>
                            <div class="modal-footer border-top-0 bg-light">
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                                <button type="submit" class="btn btn-danger">Xóa</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
            <script src="../static/js/admin.js" th:src="@{/js/admin.js}"></script>

        </div>
    </div>

</div>
