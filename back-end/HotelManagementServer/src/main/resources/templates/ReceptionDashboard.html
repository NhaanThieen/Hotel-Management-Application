<head th:remove="all">
    <title>Sơ đồ phòng - Lễ tân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/main.css">
</head>

<div xmlns:th="http://www.thymeleaf.org"
    th:replace="~{Base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}">

    <div id="custom-menu-items" th:remove="tag">
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1">
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)"
                class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start">
                <span class="d-flex align-items-center">
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i>
                    <span th:text="${groupDto.name}"></span>
                </span>
                <i class="fa-solid fa-chevron-down small text-white-50"></i>
            </button>
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded">
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}"
                    class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a>
            </div>
        </div>
    </div>

    <div id="custom-page-content" th:remove="tag">
        <div class="container-fluid py-3">

            <div class="d-flex justify-content-between align-items-end mb-4">
                <div>
                    <h4 class="fw-bold m-0 mb-1">
                        <i class="fa-solid fa-border-all me-2 text-primary"></i>Sơ Đồ Tổng Quan
                    </h4>
                    <span class="text-muted small">Cập nhật lúc: <strong id="live-time"
                            th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy HH:mm')}">29/05/2026
                            09:00</strong></span>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-success fw-semibold">
                        <i class="fa-solid fa-door-open me-1"></i>Trống (<span th:text="${countEmpty}">12</span>)
                    </button>

                    <button class="btn btn-sm btn-outline-danger fw-semibold">
                        <i class="fa-solid fa-bed me-1"></i>Đang ở (<span th:text="${countOccupied}">8</span>)
                    </button>

                    <button class="btn btn-sm btn-outline-warning text-dark fw-semibold">
                        <i class="fa-solid fa-calendar-check me-1"></i>Đã đặt (<span th:text="${countBooked}">3</span>)
                    </button>

                    <button class="btn btn-sm btn-outline-secondary fw-semibold">
                        <i class="fa-solid fa-broom me-1"></i>Đang dọn (<span th:text="${countCleaning}">2</span>)
                    </button>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-4 bg-primary bg-opacity-10">
                <div class="card-body p-3">
                    <form th:action="@{/reception/dashboard}" method="GET" class="row g-2 align-items-center">
                        <div class="col-auto">
                            <span class="fw-bold text-primary"><i class="fa-solid fa-bolt me-2"></i>Tác vụ nhanh:</span>
                        </div>
                        <div class="col-md-3">
                            <input name="guestName" th:value="${param.guestName}" type="text"
                                class="form-control form-control-sm" placeholder="Tìm tên khách">
                        </div>
                        <div class="col-md-2">
                            <input name="roomName" th:value="${param.roomName}" type="text"
                                class="form-control form-control-sm" placeholder="Số phòng">
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-sm btn-primary shadow-sm"><i
                                    class="fa-solid fa-magnifying-glass"></i> Tra cứu</button>
                            <a href="WalkInBooking.html" th:href="@{/reception/walk-in}"
                                class="btn btn-sm btn-success shadow-sm ms-2">
                                <i class="fa-solid fa-user-plus"></i> Khách đặt phòng trực tiếp
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="row g-3">

                <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6" th:each="room : ${rooms}">
                    <div class="card h-100 shadow-sm border-0 room-card status-1"
                        th:classappend="'status-' + ${room.roomStatusId.roomStatusId}" title="Nhấp để xem thao tác">
                        <div class="card-body p-3 d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h4 class="fw-bold m-0" th:text="${room.roomName}">101</h4>
                                <span class="badge text-dark"
                                    th:classappend="${room.roomStatusId.roomStatusId == 1 ? 'bg-success' : (room.roomStatusId.roomStatusId == 2 ? 'bg-danger' : (room.roomStatusId.roomStatusId == 3 ? 'bg-warning text-dark' : 'bg-secondary'))}"
                                    th:text="${room.roomStatusId.name}">
                                    Trống
                                </span>
                            </div>

                            <div class="text-secondary small fw-semibold mb-2" th:text="${room.roomTypeId.name}">
                                <i class="fa-solid fa-layer-group me-1"></i>Phòng Đơn
                            </div>

                            <div
                                class="mt-auto pt-2 border-top border-light d-flex justify-content-between align-items-center">
                                <span class="text-muted small" th:if="${room.roomStatusId.roomStatusId == 2}">
                                    <i class="fa-solid fa-user text-danger me-1"></i> <span
                                        th:text="${room.guestName ?: 'Nguyễn Văn A'}">Có khách</span>
                                </span>
                                <span class="text-muted small" th:if="${room.roomStatusId.roomStatusId == 1}">
                                    <i class="fa-solid fa-check text-success me-1"></i> Sẵn sàng
                                </span>
                                <div class="dropdown">
                                    <button class="btn btn-sm btn-light text-secondary rounded-circle px-2 border"
                                        type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                        <i class="fa-solid fa-ellipsis-vertical"></i>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">

                                        <li th:if="${room.roomStatusId.roomStatusId == 3}">
                                            <a class="dropdown-item text-success fw-semibold" href="CheckInPage.html"
                                                th:href="@{/reception/check-in(roomId=${room.roomId})}">
                                                <i class="fa-solid fa-clipboard-check me-2"></i>Làm thủ tục Nhận phòng
                                            </a>
                                        </li>

                                        <li th:if="${room.roomStatusId.roomStatusId == 2}">
                                            <a class="dropdown-item text-danger fw-semibold"
                                                href="ActiveStayManagement.html"
                                                th:href="@{/reception/active-stay(roomId=${room.roomId})}">
                                                <i class="fa-solid fa-bed me-2"></i>Quản lý phòng đang ở
                                            </a>
                                        </li>

                                        <li th:if="${room.roomStatusId.roomStatusId == 1}">
                                            <a class="dropdown-item text-primary fw-semibold" href="WalkInBooking.html"
                                                th:href="@{/reception/walk-in(roomId=${room.roomId})}">
                                                <i class="fa-solid fa-user-plus me-2"></i>Đặt phòng trực tiếp
                                            </a>
                                        </li>

                                        <li th:if="${room.roomStatusId.roomStatusId == 4}">
                                            <span class="dropdown-item text-muted">
                                                <i class="fa-solid fa-broom me-2"></i>Đang chờ dọn dẹp
                                            </span>
                                        </li>

                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


            </div>

            <div class="d-flex justify-content-center align-items-center mt-4" th:if="${totalPages > 1}">
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm m-0 shadow-sm">

                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-link text-secondary"
                                th:href="@{/reception/dashboard(page=${currentPage - 1})}" tabindex="-1">
                                <i class="fa-solid fa-chevron-left me-1"></i>Trước
                            </a>
                        </li>

                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${currentPage == i ? 'active' : ''}">
                            <a class="page-link" th:classappend="${currentPage != i ? 'text-secondary' : ''}"
                                th:href="@{/reception/dashboard(page=${i})}" th:text="${i + 1}">1</a>
                        </li>

                        <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-link text-secondary"
                                th:href="@{/reception/dashboard(page=${currentPage + 1})}">
                                Sau<i class="fa-solid fa-chevron-right ms-1"></i>
                            </a>
                        </li>

                    </ul>
                </nav>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/reception.js" th:src="@{/js/reception.js}"></script>
</div>
