<head th:remove="all">
    <title>Quản lý phòng đang ở - Lễ tân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/main.css">
</head>

<div xmlns:th="http://www.thymeleaf.org"
    th:replace="~{Base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}">

    <div id="custom-menu-items" th:remove="tag">
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1">
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)"
                class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start">
                <span class="d-flex align-items-center">
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i>
                    <span th:text="${groupDto.name}"></span>
                </span>
                <i class="fa-solid fa-chevron-down small text-white-50"></i>
            </button>
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded">
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}"
                    class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a>
            </div>
        </div>
    </div>

    <div id="custom-page-content" th:remove="tag">
        <div class="container-fluid py-3">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold m-0 text-danger">
                    <i class="fa-solid fa-bed me-2"></i>Quản lý phòng đang ở
                </h4>
                <div>
                    <a href="CheckoutReceipt.html" th:href="@{/reception/checkout(bookingId=${bookingInfo.bookingId})}"
                        class="btn btn-warning fw-semibold shadow-sm me-2">
                        <i class="fa-solid fa-file-invoice-dollar me-1"></i>Trả phòng
                    </a>
                    <a href="ReceptionDashboard.html" th:href="@{/reception/dashboard}"
                        class="btn btn-outline-secondary btn-sm">
                        <i class="fa-solid fa-arrow-left me-1"></i>Sơ đồ phòng
                    </a>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-4 bg-danger bg-opacity-10 border-start border-danger border-4">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-3 border-end border-danger-subtle">
                            <h2 class="fw-bold text-danger m-0" th:text="${bookingInfo.roomName}">102</h2>
                            <span class="text-secondary fw-semibold small" th:text="${bookingInfo.roomTypeName}">Phòng
                                Đôi VIP</span>
                        </div>
                        <div class="col-md-4 border-end border-danger-subtle">
                            <small class="text-muted d-block fw-semibold">Tên khách hàng:</small>
                            <span class="fw-bold fs-5" th:text="${bookingInfo.guestName}">Lê Tam Thiện</span>
                        </div>
                        <div class="col-md-5">
                            <small class="text-muted d-block fw-semibold">Thời gian lưu trú:</small>
                            <span><i class="fa-solid fa-arrow-right-to-bracket text-success me-1"></i> <span
                                    th:text="${#dates.format(bookingInfo.actualCheckIn, 'HH:mm dd/MM')}">14:00
                                    29/05</span></span>
                            <span class="mx-2 text-muted">|</span>
                            <span><i class="fa-solid fa-arrow-right-from-bracket text-danger me-1"></i> <span
                                    th:text="${#dates.format(bookingInfo.expectedCheckOut, 'HH:mm dd/MM')}">12:00
                                    31/05</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <ul class="nav nav-tabs" id="activeRoomTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active fw-semibold text-primary" id="service-tab" data-bs-toggle="tab"
                        data-bs-target="#service" type="button" role="tab">
                        <i class="fa-solid fa-bell-concierge me-1"></i>Gọi dịch vụ
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link fw-semibold text-success" id="extend-tab" data-bs-toggle="tab"
                        data-bs-target="#extend" type="button" role="tab">
                        <i class="fa-solid fa-calendar-plus me-1"></i>Gia hạn phòng
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link fw-semibold text-warning text-dark" id="change-tab" data-bs-toggle="tab"
                        data-bs-target="#change" type="button" role="tab">
                        <i class="fa-solid fa-right-left me-1"></i>Đổi phòng
                    </button>
                </li>
            </ul>

            <div class="tab-content bg-white border border-top-0 p-4 shadow-sm rounded-bottom"
                id="activeRoomTabsContent" style="min-height: 350px;">

                <div class="tab-pane fade show active" id="service" role="tabpanel">
                    <div class="row g-4">
                        <div class="col-md-7 border-end">
                            <h6 class="fw-bold mb-3">Danh sách dịch vụ</h6>

                            <form th:action="@{/reception/add-service}" method="POST">
                                <input type="hidden" name="bookingId" th:value="${bookingInfo.bookingId}" value="1">

                                <div class="row g-2 mb-3">
                                    <div class="col-8">
                                        <select name="serviceId" class="form-select form-select-sm" required>
                                            <option value="">-- Chọn dịch vụ --</option>
                                            <option th:each="srv : ${availableServices}" th:value="${srv.serviceId}"
                                                th:text="${srv.name + ' (' + #numbers.formatDecimal(srv.price, 0, 'COMMA', 0, 'POINT') + ' đ)'}">
                                                Nước suối (15,000 đ)</option>
                                        </select>
                                    </div>
                                    <div class="col-2">
                                        <input type="number" name="quantity" class="form-control form-control-sm"
                                            value="1" min="1" required>
                                    </div>
                                    <div class="col-2">
                                        <button type="submit" class="btn btn-sm btn-primary w-100"><i
                                                class="fa-solid fa-plus"></i></button>
                                    </div>
                                </div>
                            </form>

                            <div class="table-responsive">
                                <table class="table table-sm table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Tên dịch vụ</th>
                                            <th class="text-center">Số lượng</th>
                                            <th class="text-end">Thành tiền</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="used : ${usedServices}">
                                            <td th:text="${used.service.name}">Mì ly Hảo Hảo</td>
                                            <td class="text-center" th:text="${used.quantity}">2</td>
                                            <td class="text-end"
                                                th:text="${#numbers.formatDecimal(used.price * used.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                                30,000 đ</td>
                                            <td class="text-center">
                                                <form th:action="@{/reception/delete-service}" method="POST"
                                                    class="d-inline">
                                                    <input type="hidden" name="bookingServiceId" th:value="${used.id}">
                                                    <button type="submit" class="btn btn-link text-danger p-0"
                                                        title="Hủy món"><i class="fa-solid fa-xmark"></i></button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div
                            class="col-md-5 d-flex flex-column justify-content-center align-items-center bg-light rounded p-4">
                            <i class="fa-solid fa-receipt fs-1 text-secondary opacity-50 mb-3"></i>
                            <span class="text-muted fw-semibold">Tổng tiền dịch vụ</span>
                            <h3 class="fw-bold text-primary m-0"
                                th:text="${#numbers.formatDecimal(totalServiceFee, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                30,000 đ</h3>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="extend" role="tabpanel">
                    <div class="row justify-content-center">
                        <div class="col-md-6 text-center">
                            <h5 class="fw-bold mb-4">Gia hạn phòng</h5>
                            <form th:action="@{/reception/extend-stay}" method="POST"
                                class="card shadow-sm border border-success-subtle p-4">
                                <input type="hidden" name="bookingId" th:value="${bookingInfo.bookingId}">

                                <div class="mb-3 text-start">
                                    <label class="form-label fw-semibold text-secondary">Giờ Check-out hiện tại</label>
                                    <input type="text" class="form-control bg-light"
                                        th:value="${#dates.format(bookingInfo.expectedCheckOut, 'HH:mm dd/MM/yyyy')}"
                                        disabled>
                                </div>

                                <div class="mb-4 text-start">
                                    <label class="form-label fw-semibold text-success">Giờ Check-out mới</label>
                                    <input type="datetime-local" name="newCheckOutTime"
                                        class="form-control border-success" required>
                                </div>

                                <button type="submit" class="btn btn-success fw-semibold">
                                    <i class="fa-solid fa-floppy-disk me-2"></i>Lưu thay đổi
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="change" role="tabpanel">
                    <div class="row justify-content-center">
                        <div class="col-md-6 text-center">
                            <h5 class="fw-bold mb-4">Chuyển phòng</h5>
                            <form th:action="@{/reception/change-room}" method="POST"
                                class="card shadow-sm border border-warning-subtle p-4">
                                <input type="hidden" name="bookingId" th:value="${bookingInfo.bookingId}">

                                <div class="mb-3 text-start">
                                    <label class="form-label fw-semibold text-secondary">Phòng hiện tại</label>
                                    <input type="text" class="form-control bg-light"
                                        th:value="${bookingInfo.roomName + ' (' + bookingInfo.roomTypeName + ')'}"
                                        disabled>
                                </div>

                                <div class="mb-4 text-start">
                                    <label class="form-label fw-semibold text-warning text-dark">Chọn phòng mới</label>
                                    <select name="newRoomId" class="form-select border-warning" required>
                                        <option value="">-- Danh sách phòng còn trống --</option>
                                        <option th:each="emptyRoom : ${availableRooms}" th:value="${emptyRoom.roomId}"
                                            th:text="${emptyRoom.roomName + ' - ' + emptyRoom.roomTypeId.name}">105 -
                                            Phòng Đơn</option>
                                    </select>
                                </div>

                                <button type="submit" class="btn btn-warning text-dark fw-semibold">
                                    <i class="fa-solid fa-right-left me-2"></i>Lưu thay đổi
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/reception.js" th:src="@{/js/reception.js}"></script>
</div>
