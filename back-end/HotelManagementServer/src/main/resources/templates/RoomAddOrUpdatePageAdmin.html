<div xmlns:th="http://www.thymeleaf.org" th:replace="~{Base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}"> 

    <div id="custom-menu-items" th:remove="tag"> 
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1"> 
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)" class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start"> 
                <span class="d-flex align-items-center"> 
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i> 
                    <span th:text="${groupDto.name}"></span> 
                </span> 
                <i class="fa-solid fa-chevron-down small text-white-50"></i> 
            </button> 
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded"> 
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}" class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a> 
            </div> 
        </div> 
    </div> 

    <div id="custom-page-content" th:remove="tag"> 
        <div class="container-fluid py-4" style="max-width: 900px;">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0 text-primary">
                    <i class="fa-solid fa-person-shelter me-2"></i>Thông Tin Phòng
                </h4>
                <a th:href="@{/admin/rooms/}" class="btn btn-outline-secondary btn-sm">
                    <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <!-- Hiển thị lỗi exception -->
                    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2"></i>
                        <span th:text="${errorMsg}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/admin/rooms/addOrUpdateRoom/process}" method="POST" th:object="${roomForm}" enctype="multipart/form-data">

                        <input th:field="*{roomId}" type="hidden" name="id" value="" />

                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Số / Tên Phòng <span class="text-danger">*</span></label>
                                <input th:field="*{name}" type="text" class="form-control" placeholder="VD: Phòng 101" required>
                            </div>
                            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-1"></div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Giá mỗi đêm (VNĐ) <span class="text-danger">*</span></label>
                                <input th:field="*{price}" type="number" class="form-control" placeholder="VD: 500000" min="0" required>
                            </div>
                            <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger small mt-1"></div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Loại Phòng</label>
                                <select th:field="*{typeId}" class="form-select" required>
                                    <option value="" selected>-- Chọn loại phòng --</option>
                                    <option th:each="roomTypeItem : ${roomTypeResponse.roomTypes}"
                                            th:value="${roomTypeItem.roomTypeId}"
                                            th:text="${roomTypeItem.name}"    
                                            ></option>
                                </select>
                            </div>
                            <div th:if="${#fields.hasErrors('typeId')}" th:errors="*{typeId}" class="text-danger small mt-1"></div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Trạng Thái</label>
                                <select th:field="*{statusId}" class="form-select" required>
                                    <option value="" selected>-- Chọn trạng thái --</option>
                                    <option th:each="roomStatusItem : ${roomStatusResponse.roomStatus}" 
                                            th:value="${roomStatusItem.roomStatusId}"
                                            th:text="${roomStatusItem.name}"    
                                            ></option>
                                </select>
                            </div>
                            <div th:if="${#fields.hasErrors('statusId')}" th:errors="*{statusId}" class="text-danger small mt-1"></div>

                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Sức chứa tối đa (Người) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-users text-muted"></i></span>
                                    <input th:field="*{capacity}" class="form-control" placeholder="VD: 2" min="1" required>
                                </div>
                            </div>
                            <div th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}" class="text-danger small mt-1"></div>

                            <div class="col-12">

                                <label class="form-label fw-semibold">Cấu hình Giường</label>
                                <div class="card border border-light-subtle shadow-sm">
                                    <div class="card-body bg-light rounded d-flex flex-wrap gap-3">
                                        <div th:each="bedTypeItem, iterStat : ${bedTypeResponse.bedTypes}" class="input-group" style="width: 250px;">
                                            <span th:text="${bedTypeItem.name}" class="input-group-text bg-white small"></span>
                                            <input th:name="|beds[${iterStat.index}].bedTypeId|" th:value="${bedTypeItem.bedTypeId}" type="hidden">
                                            <input th:name="|beds[${iterStat.index}].quantity|" type="number" class="form-control" placeholder="Số lượng..." min="0" value="0">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Ảnh đại diện chính (Thumbnail)</label>
                                <input th:field="*{thumbnailImage}" type="file" class="form-control" accept="image/png, image/jpeg">
                                <div class="form-text mt-1">Ảnh hiển thị ngoài danh sách (1 ảnh).</div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Các góc chụp khác (Ảnh phụ)</label>
                                <input th:field="*{extraImageFiles}" type="file" class="form-control" accept="image/png, image/jpeg" multiple>
                                <div class="form-text mt-1">Giữ Ctrl để chọn nhiều ảnh (Tùy chọn).</div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end gap-2">
                            <button type="reset" class="btn btn-light border">Nhập lại</button>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Lưu thông tin
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div> 
    </div>
</div>
