<head th:remove="all">
    <title>Trạng thái phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/main.css">
</head>

<div xmlns:th="http://www.thymeleaf.org" th:replace="~{Base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}">

    <div id="custom-menu-items" th:remove="tag">
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1">
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)" class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start">
                <span class="d-flex align-items-center">
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i>
                    <span th:text="${groupDto.name}"></span>
                </span>
                <i class="fa-solid fa-chevron-down small text-white-50"></i>
            </button>
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded">
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}" class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a>
            </div>
        </div>
    </div>

    <div id="custom-page-content" th:remove="tag">
        <div class="container-fluid py-3">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold m-0">
                        <i class="fa-solid fa-bed me-2 text-primary"></i> Trạng thái phòng
                    </h4>
                    <span class="text-muted small">Danh sách và trạng thái các phòng trong khách sạn</span>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body bg-light rounded">
                    <form th:action="@{/admin/rooms/status}" method="GET" class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold text-secondary">Tìm kiếm</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                                <input name="name" th:value="${searchCriteria?.name}" type="text" class="form-control" placeholder="Nhập tên phòng...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold text-secondary">Hạng phòng</label>
                            <select name="typeId" class="form-select">
                                <option value="">Tất cả</option>
                                <option th:each="t : ${roomTypeResponse.roomTypes}"
                                        th:value="${t.roomTypeId}"
                                        th:text="${t.name}"
                                        th:selected="${t.roomTypeId == searchCriteria?.typeId}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold text-secondary">Trạng thái</label>
                            <select name="statusId" class="form-select">
                                <option value="">Tất cả</option>
                                <option th:each="s : ${roomStatusResponse.roomStatus}"
                                        th:value="${s.roomStatusId}"
                                        th:text="${s.name}"
                                        th:selected="${s.roomStatusId == searchCriteria?.statusId}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-secondary w-100">Lọc dữ liệu</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0 overflow-hidden mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-secondary">
                                <tr>
                                    <th class="ps-4">Phòng</th>
                                    <th>Ảnh</th>
                                    <th>Hạng</th>
                                    <th>Trạng thái</th>
                                    <th class="text-center pe-4">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="r : ${roomSearchResponse.rooms}">
                                    <td class="ps-4" th:text="${r.roomName}">101</td>
                                    <td>
                                        <img th:if="${r.avatar != null and !#strings.isEmpty(r.avatar)}"
                                             th:src="${r.avatar}"
                                             alt="Ảnh phòng"
                                             class="rounded border shadow-sm"
                                             style="width: 80px; height: 50px; object-fit: cover;">
                                        <span th:unless="${r.avatar != null and !#strings.isEmpty(r.avatar)}" class="text-muted small">-</span>
                                    </td>
                                    <td th:text="${r.roomTypeId != null ? r.roomTypeId.name : '-'}">Standard</td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${r.roomStatusId != null and r.roomStatusId.roomStatusId == 1} ? 'bg-success' : ${r.roomStatusId != null and r.roomStatusId.roomStatusId == 2} ? 'bg-danger' : ${r.roomStatusId != null and r.roomStatusId.roomStatusId == 3} ? 'bg-warning text-dark' : 'bg-secondary'"
                                              th:text="${r.roomStatusId != null ? r.roomStatusId.name : '-'}">AVAILABLE</span>
                                    </td>
                                    <td class="text-center pe-4">
                                        <a href="#" th:attr="data-id=${r.roomId},data-name=${r.roomName},data-type=${r.roomTypeId != null ? r.roomTypeId.name : '-'},data-status=${r.roomStatusId != null ? r.roomStatusId.name : '-'}"
                                           class="btn btn-sm btn-outline-primary btn-room-detail">Chi tiết</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted small" th:text="|Tổng số ${#lists.size(roomSearchResponse.rooms)} phòng|">Tổng số 0 phòng</span>
            </div>

        </div>

        <!-- Room detail modal -->
        <div class="modal fade" id="roomDetailModal" tabindex="-1" aria-labelledby="roomDetailModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header bg-light border-bottom-0">
                        <h5 class="modal-title fw-bold text-dark" id="roomDetailModalLabel">Chi tiết phòng</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <dl class="row">
                            <dt class="col-4">Mã phòng</dt><dd class="col-8" id="roomDetailCode">-</dd>
                            <dt class="col-4">Hạng</dt><dd class="col-8" id="roomDetailType">-</dd>
                            <dt class="col-4">Trạng thái</dt><dd class="col-8" id="roomDetailStatus">-</dd>
                        </dl>
                    </div>
                    <div class="modal-footer border-top-0 bg-light">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
                        <a id="roomDetailLink" href="#" class="btn btn-primary">Xem chi tiết</a>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../static/js/admin.js" th:src="@{/js/admin.js}"></script>
    </div>

</div>
