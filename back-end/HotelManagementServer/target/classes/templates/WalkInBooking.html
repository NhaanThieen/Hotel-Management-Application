<head th:remove="all">
    <title>Khách đặt phòng trực tiếp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/main.css">
</head>

<div xmlns:th="http://www.thymeleaf.org"
    th:replace="~{Base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}">

    <div id="custom-menu-items" th:remove="tag">
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1">
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)"
                class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start">
                <span class="d-flex align-items-center">
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i>
                    <span th:text="${groupDto.name}"></span>
                </span>
                <i class="fa-solid fa-chevron-down small text-white-50"></i>
            </button>
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded">
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}"
                    class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a>
            </div>
        </div>
    </div>

    <div id="custom-page-content" th:remove="tag">
        <div class="container-fluid py-3">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0">
                    <i class="fa-solid fa-user-plus me-2 text-success"></i>Khách hàng đặt phòng trực tiếp
                </h4>
                <a href="ReceptionDashboard.html" th:href="@{/reception/dashboard}"
                    class="btn btn-outline-secondary btn-sm">
                    <i class="fa-solid fa-arrow-left me-1"></i>Sơ đồ phòng
                </a>
            </div>

            <form th:action="@{/reception/walk-in}" method="POST" th:object="${bookingForm}">

                <div class="row g-4">
                    <div class="col-lg-5">

                        <div class="card shadow-sm border-0 mb-4">
                            <div class="card-header bg-white border-bottom-0 pt-3 pb-0">
                                <h6 class="fw-bold text-primary"><i class="fa-solid fa-address-card me-2"></i>1. Thông
                                    tin khách hàng</h6>
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label class="form-label small fw-semibold text-secondary">Số điện thoại</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i
                                                    class="fa-solid fa-phone text-muted"></i></span>
                                            <input type="text" th:field="*{phone}" class="form-control"
                                                placeholder="Nhập số điện thoại" required>
                                            <button id="btnSearchPhone" class="btn btn-outline-secondary"
                                                type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-semibold text-secondary">Họ và tên khách
                                            hàng</label>
                                        <input type="text" th:field="*{guestName}" class="form-control"
                                            placeholder="Nhập họ tên khách hàng" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white border-bottom-0 pt-3 pb-0">
                                <h6 class="fw-bold text-primary"><i class="fa-solid fa-calendar-days me-2"></i>2. Thời
                                    gian lưu trú</h6>
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-sm-6">
                                        <label class="form-label small fw-semibold text-secondary">Nhận phòng</label>
                                        <input type="datetime-local" th:field="*{timeStart}" id="timeStart"
                                            class="form-control" required>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label small fw-semibold text-secondary">Trả phòng</label>
                                        <input type="datetime-local" th:field="*{timeEnd}" id="timeEnd"
                                            class="form-control" required>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-semibold text-secondary">Ghi chú</label>
                                        <textarea th:field="*{note}" class="form-control" rows="2"
                                            placeholder="Ví dụ: Nhập ghi chú nếu cần"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="col-lg-7">

                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white border-bottom-0 pt-3 pb-0">
                                <h6 class="fw-bold text-primary"><i class="fa-solid fa-key me-2"></i>3. Lựa chọn phòng &
                                    Xác nhận</h6>
                            </div>
                            <div class="card-body d-flex flex-column">

                                <div class="mb-3">
                                    <label class="form-label small fw-semibold text-secondary">Lọc theo Loại
                                        phòng</label>
                                    <select id="roomTypeSelect" class="form-select">
                                        <option value="">-- Tất cả loại phòng --</option>
                                        <option th:each="type : ${roomTypes}" th:value="${type.roomTypeId}"
                                            th:text="${type.name}">Phòng Đơn</option>
                                    </select>
                                </div>

                                <label class="form-label small fw-semibold text-secondary mb-2">Phòng khả dụng:</label>

                                <div class="row g-2 mb-4 overflow-auto" style="max-height: 250px;">
                                    <div class="col-md-4 col-sm-6 room-card-container"
                                        th:each="room : ${availableRooms}" th:data-type="${room.roomTypeId.roomTypeId}">

                                        <input type="radio" th:field="*{roomId}" th:value="${room.roomId}"
                                            th:data-price="${room.roomTypeId.price}" class="btn-check"
                                            th:id="'room-' + ${room.roomId}" required>

                                        <label class="btn btn-outline-success w-100 text-start p-2"
                                            th:for="'room-' + ${room.roomId}">
                                            <div class="fw-bold" th:text="${room.roomName}">101</div>
                                            <div class="small text-muted" th:text="${room.roomTypeId.name}">Phòng Đơn
                                            </div>
                                            <div class="small fw-semibold mt-1">
                                                <i class="fa-solid fa-tag text-success me-1"></i>
                                                <span
                                                    th:text="${#numbers.formatDecimal(room.roomTypeId.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">500,000
                                                    đ</span>
                                            </div>
                                        </label>
                                    </div>
                                </div>

                                <div class="col-12 text-center text-muted p-3"
                                    th:if="${#lists.isEmpty(availableRooms)}">
                                    <i class="fa-solid fa-box-open fs-3 mb-2 opacity-50"></i>
                                    <p class="m-0 small">Không có phòng trống phù hợp thời gian này.</p>
                                </div>
                            </div>

                            <div class="mt-auto p-3 bg-light rounded border border-light-subtle">

                                <div class="row g-2 mb-3 pb-3 border-bottom border-secondary-subtle">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-semibold text-secondary">Số tiền cọc</label>
                                        <div class="input-group input-group-sm">
                                            <input type="number" th:field="*{depositAmount}" class="form-control"
                                                placeholder="0">
                                            <span class="input-group-text">VNĐ</span>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-semibold text-secondary">Phương thức thanh
                                            toán</label>
                                        <select th:field="*{paymentMethodId}" class="form-select form-select-sm">
                                            <option value="1">Tiền mặt</option>
                                            <option value="2">Chuyển khoản / QR Code</option>
                                            <option value="3">Thẻ tín dụng (POS)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <span class="text-secondary fw-semibold">Phí tạm tính:</span>
                                    <h5 id="tempTotalAmount" class="fw-bold text-danger m-0">--- đ</h5>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" name="action" value="BOOK_ONLY"
                                        class="btn btn-warning text-dark w-100 fw-semibold">
                                        <i class="fa-solid fa-calendar-check me-1"></i>Lưu đặt phòng
                                    </button>
                                    <button type="submit" name="action" value="CHECK_IN_NOW"
                                        class="btn btn-success w-100 fw-semibold">
                                        <i class="fa-solid fa-door-open me-1"></i>Nhận Phòng Ngay
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>
        </div>
        </form>

    </div>
</div>

<script src="../static/js/reception.js" th:src="@{/js/reception.js}"></script>
</div>
