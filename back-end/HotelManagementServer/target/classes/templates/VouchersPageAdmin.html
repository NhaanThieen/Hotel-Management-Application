<head th:remove="all">
    <title>Quản lý vouchers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/main.css">
</head>

<div xmlns:th="http://www.thymeleaf.org" th:replace="~{Base :: layout(~{:: #custom-menu-items}, ~{:: #custom-page-content})}">

    <div id="custom-menu-items" th:remove="tag">
        <div th:each="groupDto : ${sidebarMenu}" class="mb-1">
            <button th:data-id="${groupDto.id}" onclick="toggleSubmenu(this.dataset.id)" class="w-100 border-0 bg-transparent text-white-50 p-3 rounded hover-bg-effect d-flex align-items-center justify-content-between text-start">
                <span class="d-flex align-items-center">
                    <i th:class="|fa-solid ${groupDto.icon} me-3 text-info fs-5|" style="width: 24px;"></i>
                    <span th:text="${groupDto.name}"></span>
                </span>
                <i class="fa-solid fa-chevron-down small text-white-50"></i>
            </button>
            <div th:id="${groupDto.id}" class="ps-4 d-none bg-black bg-opacity-25 rounded">
                <a th:each="item : ${groupDto.sidebarItems}" th:text="${item.name}" class="nav-link text-white-50 py-2 px-3 rounded hover-bg-sub small" th:href="@{${item.url}}"></a>
            </div>
        </div>
    </div>

    <div id="custom-page-content" th:remove="tag">
        <div class="container-fluid py-3">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold m-0">
                        <i class="fa-solid fa-ticket me-2 text-primary"></i> Vouchers
                    </h4>
                    <span class="text-muted small">Quản lý khuyến mãi và mã giảm giá</span>
                </div>
                <button class="btn btn-primary shadow-sm btn-voucher-add" type="button">
                    <i class="fa-solid fa-plus me-1"></i> Thêm voucher
                </button>
            </div>

            <div class="card shadow-sm border-0 overflow-hidden mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-secondary">
                                <tr>
                                    <th class="ps-4">Mã</th>
                                    <th>Tên voucher</th>
                                    <th>Số lượng</th>
                                    <th>% giảm</th>
                                    <th>Giảm tối đa</th>
                                    <th>Đơn tối thiểu</th>
                                    <th>Trạng thái</th>
                                    <th class="text-center pe-4">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${voucherList == null or #lists.isEmpty(voucherList)}">
                                    <td colspan="8" class="text-center py-5 text-muted">
                                        Chưa có voucher nào.
                                    </td>
                                </tr>
                                <tr th:each="voucher : ${voucherList}">
                                    <td class="ps-4 fw-semibold" th:text="${voucher.voucherId}">1</td>
                                    <td th:text="${voucher.name}">SALE10</td>
                                    <td th:text="${voucher.quantity}">100</td>
                                    <td th:text="${voucher.percentDiscount != null ? voucher.percentDiscount + '%' : '-'}">10%</td>
                                    <td th:text="${voucher.maxDiscount != null ? #numbers.formatDecimal(voucher.maxDiscount, 0, 'COMMA', 0, 'POINT') + ' đ' : '-'}">50,000 đ</td>
                                    <td th:text="${voucher.minRequire != null ? #numbers.formatDecimal(voucher.minRequire, 0, 'COMMA', 0, 'POINT') + ' đ' : '-'}">200,000 đ</td>
                                    <td>
                                        <span class="badge" th:classappend="${voucher.isActive == 1} ? 'bg-success' : 'bg-secondary'"
                                              th:text="${voucher.isActive == 1 ? 'Hoạt động' : 'Tạm tắt'}">Hoạt động</span>
                                    </td>
                                    <td class="text-center pe-4">
                                        <button type="button"
                                                class="btn btn-sm btn-outline-primary me-1 btn-voucher-edit"
                                                th:attr="data-id=${voucher.voucherId},data-name=${voucher.name},data-quantity=${voucher.quantity},data-percent=${voucher.percentDiscount},data-max=${voucher.maxDiscount},data-min=${voucher.minRequire},data-active=${voucher.isActive}"
                                                title="Chỉnh sửa">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </button>
                                        <button type="button"
                                                class="btn btn-sm btn-outline-danger btn-voucher-delete"
                                                th:attr="data-id=${voucher.voucherId},data-name=${voucher.name}"
                                                title="Xóa">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted small" th:text="|Tổng số ${(voucherList != null ? #lists.size(voucherList) : 0)} voucher|">Tổng số 0 voucher</span>
            </div>

            <div class="modal fade" id="voucherModal" tabindex="-1" aria-labelledby="voucherModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-lg">
                    <div class="modal-content border-0 shadow">
                        <form id="voucherForm" method="post" action="#">
                            <div class="modal-header bg-light border-bottom-0">
                                <h5 class="modal-title fw-bold text-dark" id="voucherModalLabel">Thêm voucher</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" id="voucherId" name="voucherId">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="voucherName" class="form-label">Tên voucher</label>
                                        <input type="text" class="form-control" id="voucherName" name="name" placeholder="Ví dụ: SALE10">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="voucherQuantity" class="form-label">Số lượng</label>
                                        <input type="number" class="form-control" id="voucherQuantity" name="quantity" min="0" step="1" placeholder="Ví dụ: 100">
                                    </div>
                                    <div class="col-md-4">
                                        <label for="voucherPercentDiscount" class="form-label">% giảm</label>
                                        <input type="number" class="form-control" id="voucherPercentDiscount" name="percentDiscount" min="0" step="1" placeholder="Ví dụ: 10">
                                    </div>
                                    <div class="col-md-4">
                                        <label for="voucherMaxDiscount" class="form-label">Giảm tối đa</label>
                                        <input type="number" class="form-control" id="voucherMaxDiscount" name="maxDiscount" min="0" step="1" placeholder="Ví dụ: 50000">
                                    </div>
                                    <div class="col-md-4">
                                        <label for="voucherMinRequire" class="form-label">Đơn tối thiểu</label>
                                        <input type="number" class="form-control" id="voucherMinRequire" name="minRequire" min="0" step="1" placeholder="Ví dụ: 200000">
                                    </div>
                                    <div class="col-md-4">
                                        <label for="voucherIsActive" class="form-label">Trạng thái</label>
                                        <select class="form-select" id="voucherIsActive" name="isActive">
                                            <option value="1">Hoạt động</option>
                                            <option value="0">Tạm tắt</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer border-top-0 bg-light">
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                                <button type="submit" class="btn btn-primary" id="voucherSubmitBtn">Lưu thay đổi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="voucherDeleteModal" tabindex="-1" aria-labelledby="voucherDeleteModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content border-0 shadow">
                        <form id="voucherDeleteForm" method="post" action="#">
                            <div class="modal-header bg-light border-bottom-0">
                                <h5 class="modal-title fw-bold text-dark" id="voucherDeleteModalLabel">Xóa voucher</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" id="voucherDeleteId" name="voucherId">
                                <p class="mb-0">Bạn có chắc chắn muốn xóa voucher <strong id="voucherDeleteName">-</strong> không?</p>
                            </div>
                            <div class="modal-footer border-top-0 bg-light">
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                                <button type="submit" class="btn btn-danger">Xóa</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
            <script src="../static/js/admin.js" th:src="@{/js/admin.js}"></script>

        </div>
    </div>

</div>
